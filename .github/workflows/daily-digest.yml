name: Daily Activity & Repository Digest

on:
  schedule:
    - cron: "30 3 * * *" # Runs daily at 03:30 UTC completely unattended
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  generate-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Record daily activity and generate repository digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          echo "$(date -u +'%Y-%m-%d %H:%M:%S UTC') - automated daily activity heartbeat" >> data/activity.log
          python scripts/update_digest.py

      - name: Commit and push daily activity
        run: |
          git config user.name "Aditya Sudhir Pawar"
          git config user.email "adityapawarone8@gmail.com"
          git add data/activity.log DIGEST.md README.md
          if git diff --staged --quiet; then
            echo "No changes detected."
          else
            git commit -m "chore(activity): automated daily activity and repository digest [skip ci]"
            git push origin main
          fi
